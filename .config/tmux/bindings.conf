# vi keybindings
set-window-option -g mode-keys vi
unbind -T copy-mode-vi Space
bind -T copy-mode-vi v send-keys -X begin-selection

# Open current directory
bind o run-shell "open '#{pane_current_path}'"
bind -r e kill-pane -a

# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Toggle popup tmux window
bind C-r if-shell -F '#{==:#{session_name},popup}' {
    detach-client
} {
    display-popup -d "#{pane_current_path}" -xC -yC -w 76% -h 75% -E 'tmux attach-session -t popup || tmux new-session -s popup'
}

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Keep panes evenly sized when splitting.
bind | split-window -h -c "#{pane_current_path}" \; select-layout even-horizontal
bind % split-window -h -c "#{pane_current_path}" \; select-layout even-horizontal
bind - split-window -v -c "#{pane_current_path}" \; select-layout even-vertical
bind '"' split-window -v -c "#{pane_current_path}" \; select-layout even-vertical
