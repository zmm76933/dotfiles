# Display lazygit
bind -r g display-popup -d '#{pane_current_path}' -w75% -h75% -E lazygit

# Claude Session Manager
set -g @claude_launch_key 'i'
set -g @claude_popup_width '75%'
set -g @claude_popup_height '75%'
set -g @claude_fzf_options "\
  --prompt 'nav> ' \
  --bind 'j:down' \
  --bind 'k:up' \
  --bind 'q:abort' \
  --bind 'x:execute-silent(kill {3})+reload(sleep 0.3; \$CLAUDE_PICKER --list)' \
  --bind 'i:unbind(j,k,q,i,a,x)+change-prompt(filter> )' \
  --bind 'a:unbind(j,k,q,i,a,x)+change-prompt(filter> )' \
  --bind 'esc:rebind(j,k,q,i,a,x)+change-prompt(nav> )'"

# tmux-open-nvim
set -g @ton-open-strategy ':tabnew'

# extrakto
set -g @extrakto_popup_size "75%"
set -g @extrakto_filter_key "alt-f"
set -g @extrakto_grab_key "alt-g"
set -g @extrakto_edit_key "alt-e"
